# Smoke-test overlay: run the images exactly as packaged.
# The dev compose file builds the api `dev` target, bind-mounts ./apps/api over
# /app and runs uvicorn --reload. Here the api uses the production `runtime`
# target with its own CMD and no mounts, so the HEALTHCHECKs exercise the files
# that were actually built into the images.
#
# `make smoke` supplies a temporary signing key and runs the checks.
services:
  api:
    build:
      target: runtime
    environment:
      ENV: production
      SECRET_KEY: ${SMOKE_SECRET_KEY:-}
      TRUSTED_HOSTS: '["api.example.com"]'
    volumes: !reset []
  web:
    env_file: !reset []
    environment:
      WEB_LEGAL_APP_NAME: Compose runtime smoke app
      WEB_SUPPORT_EMAIL: deletion@smoke.example.com
      ANDROID_PACKAGE_NAME: com.example.smoke
      ANDROID_SHA256_CERT_FINGERPRINTS: "AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB:AB"
      IOS_TEAM_ID: abcde12345
      IOS_BUNDLE_ID: com.example.smoke
      IOS_APPLINK_PATHS: /verify-email,/reset-password,/invite/*
