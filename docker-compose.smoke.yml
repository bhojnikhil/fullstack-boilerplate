# Smoke-test overlay: run the images exactly as packaged.
# The dev compose file builds the api `dev` target, bind-mounts ./apps/api over
# /app and runs uvicorn --reload. Here the api uses the production `runtime`
# target with its own CMD and no mounts, so the HEALTHCHECKs exercise the files
# that were actually built into the images.
#
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml up -d --build --wait postgres api web
#   (or: make smoke)
services:
  api:
    build:
      target: runtime
    volumes: !reset []
