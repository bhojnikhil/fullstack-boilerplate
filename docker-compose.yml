# Local development stack: postgres, api (hot reload), worker, web, mailpit.
# `make up` starts it; see docker-compose.smoke.yml for the as-packaged check.
services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boilerplate
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the non-owner role the API uses (first start of an empty volume only;
      # `make db-bootstrap` does the same for an existing one).
      - ./scripts/db/bootstrap-app-role.sql:/bootstrap-app-role.sql:ro
      - ./scripts/db/initdb/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d boilerplate"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend. Uses the `dev` image target (dev tools, --reload) with the
  # source bind-mounted; the virtualenv lives at /opt/venv, outside the mount.
  api:
    build:
      context: ./apps/api
      target: dev
    environment:
      ENV: development
      # The API connects as a non-owner role so row-level security applies to it;
      # migrations (`make migrate-compose`) run as the owner. Development credentials.
      DATABASE_URL: postgresql://app_user:app_user@postgres:5432/boilerplate
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/boilerplate
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      # Links in emails open the web app.
      WEB_URL: http://localhost:${WEB_PORT:-3000}
      # Outgoing email is captured by Mailpit: http://localhost:${MAILPIT_UI_PORT:-8025}
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./apps/api:/app

  # Background job worker (email, push, periodic cleanup). Same image and settings as the
  # api; it has no reload, so `docker compose restart worker` after changing job code.
  worker:
    build:
      context: ./apps/api
      target: dev
    command: ["python", "-m", "app.jobs"]
    environment:
      ENV: development
      DATABASE_URL: postgresql://app_user:app_user@postgres:5432/boilerplate
      WEB_URL: http://localhost:${WEB_PORT:-3000}
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "--heartbeat", "/tmp/worker-heartbeat", "90"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Next.js frontend. Runs the production build (standalone `server.js`);
  # rebuild to pick up changes (`docker compose up -d --build web`), or use
  # `make dev` for hot reload (web dev server on the host).
  web:
    env_file:
      - path: apps/web/.env.local
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    build:
      # Repository root: the pnpm workspace and lockfile live there.
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* values are inlined by `next build`, so they are build
      # args, not runtime env. The browser uses this URL, so it must be
      # host-reachable (not the in-network `http://api:8000`).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  # Local SMTP server and inbox UI. Nothing is delivered to real addresses.
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  postgres_data:
