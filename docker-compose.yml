services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: boilerplate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boilerplate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: boilerplate-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/boilerplate
      SECRET_KEY: test-secret-key-do-not-use-in-production-12345678
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Next.js Frontend
  client:
    # Runs the production build (`next start`); rebuild to pick up changes
    # (`docker compose up -d --build client`), or use `npm run dev` in client/.
    build:
      context: ./client
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are inlined by `next build`, so they are build
      # args, not runtime env. The browser uses this URL, so it must be
      # host-reachable (not the in-network `http://api:8000`).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: boilerplate-client
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
