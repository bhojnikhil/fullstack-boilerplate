minimum_pre_commit_version: "4.7.0"
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^docker-compose\.smoke\.yml$
      - id: check-yaml
        name: Check YAML syntax (Compose tags)
        args: [--unsafe]
        files: ^docker-compose\.smoke\.yml$
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --project apps/api --locked ruff check --fix --force-exclude --
        language: system
        files: ^apps/api/
        types_or: [python, pyi]

      - id: ruff-format
        name: Ruff format
        entry: uv run --project apps/api --locked ruff format --force-exclude --
        language: system
        files: ^apps/api/
        types_or: [python, pyi]

      - id: mypy
        name: mypy (API)
        entry: uv run --directory apps/api --locked mypy app healthcheck.py
        language: system
        files: ^apps/api/(.*\.pyi?|pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: prettier
        name: Prettier (JS workspaces)
        entry: pnpm exec prettier --write --ignore-unknown --
        language: system
        files: ^(apps/(web|mobile)|packages)/
        types: [text]

      - id: eslint
        name: ESLint (JS workspaces)
        entry: pnpm lint
        language: system
        files: ^((apps/(web|mobile)|packages)/|package\.json$|pnpm-(lock|workspace)\.yaml$)
        types_or: [javascript, jsx, ts, tsx, json, yaml]
        pass_filenames: false
