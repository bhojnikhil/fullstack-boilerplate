name: Neon preview database

# Optional: one Neon branch per pull request, migrated with the PR's Alembic revisions,
# deleted when the PR closes. Skips with a notice when NEON_API_KEY / NEON_PROJECT_ID are
# absent (always the case for fork PRs). It creates a database only; it does not deploy
# the API or web. The connection strings are never printed or stored: use the Neon
# console for the branch `preview/pr-<number>` if you want to point a local API at it.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: neon-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  branch:
    name: Neon branch for this PR
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - id: gate
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the Neon preview branch: set the NEON_API_KEY secret and the NEON_PROJECT_ID variable."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: neon
        if: steps.gate.outputs.enabled == 'true'
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          # Branches from the project's default branch unless parent_branch is set.

      - if: steps.gate.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      # db_url is the direct (non-pooled) URL; migrations must not go through PgBouncer.
      - name: Migrate the preview branch
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          uv sync --locked
          uv run --locked alembic upgrade head

  cleanup:
    name: Delete the Neon branch
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - id: gate
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the Neon branch cleanup: NEON_API_KEY / NEON_PROJECT_ID are not set."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview/pr-${{ github.event.pull_request.number }}
