name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions: {}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        working-directory: ${{ runner.temp }}
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" gitleaks

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git rev-parse --verify "${BASE_SHA}^{commit}"
          git rev-parse --verify "${HEAD_SHA}^{commit}"
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts="--diff-merges=first-parent --all" .'

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          response="$RUNNER_TEMP/dependency-graph-response"
          code=$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GH_REPO}/dependency-graph/sbom")
          case "$code" in
            200) echo "available=true" >> "$GITHUB_OUTPUT" ;;
            403|404)
              echo "::warning::Dependency graph API returned HTTP $code. Enable Dependency Graph in repository settings to run dependency review."
              echo "available=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Dependency graph API returned unexpected HTTP $code."
              cat "$response"
              exit 1
              ;;
          esac

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        if: steps.dependency-graph.outputs.available == 'true'
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown

  pip-audit:
    name: pip-audit (API lockfile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - name: Export and audit locked API dependencies
        working-directory: apps/api
        run: |
          requirements="$RUNNER_TEMP/api-requirements.txt"
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file "$requirements"
          uv tool run --python 3.13 --from pip-audit==2.10.1 pip-audit \
            --requirement "$requirements" --require-hashes --disable-pip

  pnpm-audit:
    name: pnpm audit (production)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
