name: Deploy (placeholder)

# No deployment is implemented yet. This workflow used to run on every push to
# main and report a green "Deploy" while only echoing text, which was misleading.
# It is now manual-only and says plainly that nothing is deployed. A real deploy
# workflow (that skips cleanly when secrets are absent) replaces it in a later phase.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Nothing to deploy
        run: |
          echo "::notice::No deployment is configured for this repository yet. Nothing was deployed."
