name: Tests

on:
  push:
    branches: [main, develop]
  # Any base branch, so stacked PRs (e.g. v2/* phases) are tested too.
  pull_request:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: api/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('api/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        working-directory: api
        run: poetry install

      - name: Run linting
        working-directory: api
        run: |
          poetry run ruff check .
          poetry run mypy app

      - name: Run tests
        working-directory: api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: poetry run pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./api/coverage.xml

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run linting
        working-directory: client
        run: npm run lint

      - name: Type check
        working-directory: client
        run: npm run type-check

      - name: Build
        working-directory: client
        run: npm run build

  test-customize-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Runs scripts/customize.sh on a throwaway copy (GNU sed on Linux; the
      # BSD sed path is exercised on macOS).
      - name: Test customize.sh
        run: ./scripts/test-customize.sh

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    env:
      # Smoke overlay: no ./api bind mount and no --reload, so the checks
      # below exercise the files packaged in the image.
      COMPOSE_FILE: docker-compose.yml:docker-compose.smoke.yml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test .dockerignore files
        run: ./scripts/test-dockerignore.sh

      - name: Build images
        run: docker compose build

      # Regression check for the API container HEALTHCHECK: --wait fails if
      # the api service does not become healthy.
      - name: Start postgres + api and wait for healthy
        run: docker compose up -d --wait --wait-timeout 120 postgres api

      - name: Assert api runs without a source mount
        run: |
          mounts=$(docker inspect --format '{{json .Mounts}}' "$(docker compose ps -q api)")
          echo "api mounts: $mounts"
          [ "$mounts" = "[]" ]

      - name: Show container status
        if: always()
        run: |
          docker compose ps
          docker inspect --format '{{json .State.Health}}' "$(docker compose ps -q api)" || true

      - name: Show api logs on failure
        if: failure()
        run: docker compose logs api

      - name: Stop services
        if: always()
        run: docker compose down -v
