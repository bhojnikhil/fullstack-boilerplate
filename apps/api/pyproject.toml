[project]
name = "api"
version = "1.0.0"
description = "Full-stack boilerplate API"
license = "MIT"
requires-python = "==3.13.*"
# Exact pins; the full resolution is locked in uv.lock.
dependencies = [
    "alembic==1.20.1",
    # Held at 4.x: 5.x raises on passwords over 72 bytes (would surface as 500s).
    # bcrypt is replaced by argon2id in the auth redesign.
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.9",
    "pydantic[email]==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "uvicorn[standard]==0.54.0",
    "structlog==26.1.0",
    "greenlet==3.5.6",
    "pwdlib[argon2,bcrypt]==0.4.2",
    "pyjwt==2.15.1",
    "google-auth==2.63.1",
    # IANA zone data for validating workspace timezones on any platform.
    "tzdata==2026.6",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
]

[tool.uv]
# This is an application, not a library: install dependencies only.
package = false
required-version = "==0.13.9"

# Pytest Configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]
omit = ["*/tests/*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
fail_under = 96.0
precision = 2

# Ruff Configuration (Linting & Formatting)
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() pattern is intentional

[tool.ruff.lint.isort]
known-first-party = ["app"]

# MyPy Configuration (Type Checking)
[tool.mypy]
python_version = "3.13"
strict = true

# python-jose does not ship typing metadata.
[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true
